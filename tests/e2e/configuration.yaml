# Minimal, deterministic Home Assistant configuration for the Docker E2E suite.
homeassistant:
  name: Autodarts E2E
  time_zone: Europe/Berlin
  country: DE
  language: en
  unit_system: metric
  currency: EUR
  latitude: 0
  longitude: 0
  elevation: 0

api:
config:
diagnostics:
onboarding:
system_log:
websocket_api:

logger:
  default: warning
  logs:
    custom_components.autodarts: debug
