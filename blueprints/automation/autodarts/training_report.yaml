blueprint:
  name: "Autodarts: training report"
  description: >-
    Sends a summary of your training session at a fixed time, for example
    a notification with your 3-dart average every evening. Days without
    darts are skipped.


    Your actions can use the variables `darts`, `average`, `highest`,
    `scores_180` and `summary` (a ready-made sentence). To start a new
    session every day, add "Reset training statistics" of your board as
    the last action.
  domain: automation
  author: Dennis Otto
  source_url: https://github.com/Dennis-Otto/ha-autodarts/blob/main/blueprints/automation/autodarts/training_report.yaml
  homeassistant:
    min_version: "2026.8.0"
  input:
    schedule:
      name: Schedule
      icon: mdi:clock-outline
      input:
        report_time:
          name: Time
          default: "21:00:00"
          selector:
            time: {}
        minimum_darts:
          name: Minimum darts
          description: Skip the report when fewer darts were thrown.
          default: 1
          selector:
            number:
              min: 1
              max: 1000
              mode: box
    statistics:
      name: Statistics
      icon: mdi:chart-box-outline
      input:
        darts_sensor:
          name: Training darts
          selector:
            entity:
              filter:
                - integration: autodarts
                  domain: sensor
        average_sensor:
          name: Training 3-dart average
          selector:
            entity:
              filter:
                - integration: autodarts
                  domain: sensor
        highest_sensor:
          name: Training highest visit
          selector:
            entity:
              filter:
                - integration: autodarts
                  domain: sensor
        maximum_sensor:
          name: Training 180s
          selector:
            entity:
              filter:
                - integration: autodarts
                  domain: sensor
    report:
      name: Report
      icon: mdi:message-text
      input:
        report_actions:
          name: Actions
          description: For example a notification with the `summary`.
          selector:
            action: {}

mode: single
max_exceeded: silent

triggers:
  - trigger: time
    at: !input report_time

variables:
  darts_sensor: !input darts_sensor
  average_sensor: !input average_sensor
  highest_sensor: !input highest_sensor
  maximum_sensor: !input maximum_sensor
  minimum_darts: !input minimum_darts
  darts: "{{ states(darts_sensor) | int(0) }}"
  average: "{{ states(average_sensor) | float(0) | round(1) }}"
  highest: "{{ states(highest_sensor) | int(0) }}"
  scores_180: "{{ states(maximum_sensor) | int(0) }}"
  summary: >-
    {{ darts }} darts, 3-dart average {{ average }}, highest visit {{ highest }}{{
    (', ' ~ scores_180 ~ ' × 180') if scores_180 > 0 else '' }}.

conditions:
  - condition: template
    value_template: "{{ darts >= minimum_darts }}"

actions: !input report_actions
