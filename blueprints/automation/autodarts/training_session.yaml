blueprint:
  name: "Autodarts: training session routine"
  description: >-
    Gets the board ready when a training session starts and tidies up when it
    ends. It can start the detection, calibrate the cameras and run your own
    actions, for example to switch the board light on and off. Start sessions
    with the "Training session" switch or from the training card, and turn off
    "Start sessions automatically" if you only want to train on purpose.
  domain: automation
  author: Dennis Otto
  source_url: https://github.com/Dennis-Otto/ha-autodarts/blob/main/blueprints/automation/autodarts/training_session.yaml
  homeassistant:
    min_version: "2026.8.0"
  input:
    board_events:
      name: Board events
      description: The "Board events" entity of your Autodarts board.
      selector:
        entity:
          filter:
            - integration: autodarts
              domain: event
    detection:
      name: Detection switch
      description: >-
        Optional. The "Detection" switch of the board. It is turned on when a
        session starts and off when it ends.
      default: []
      selector:
        entity:
          filter:
            - integration: autodarts
              domain: switch
    calibration:
      name: Calibration button
      description: >-
        Optional. The "Start automatic calibration" button of the board. It is
        pressed after the detection has started. Remove the darts first. When
        the first dart started the session, it stays in the board, so the
        calibration is skipped.
      default: []
      selector:
        entity:
          filter:
            - integration: autodarts
              domain: button
    calibration_delay:
      name: Wait before calibrating
      description: Gives the cameras time to open after the detection starts.
      default: 5
      selector:
        number:
          min: 0
          max: 60
          unit_of_measurement: s
    session_started:
      name: When a session starts
      description: Runs first, for example to switch on the board light.
      default: []
      selector:
        action: {}
    session_ended:
      name: When a session ends
      description: >-
        Runs after the detection has stopped. The variables reason, darts,
        average and duration_minutes describe the session.
      default: []
      selector:
        action: {}

mode: queued
max: 5
max_exceeded: silent

variables:
  detection: !input detection
  calibration: !input calibration

triggers:
  - trigger: event.received
    id: started
    target:
      entity_id: !input board_events
    options:
      event_type:
        - session_started
  - trigger: event.received
    id: ended
    target:
      entity_id: !input board_events
    options:
      event_type:
        - session_ended

actions:
  - variables:
      reason: "{{ trigger.to_state.attributes.reason | default('') }}"
      darts: "{{ trigger.to_state.attributes.darts | default(0) }}"
      average: "{{ trigger.to_state.attributes.average | default(none) }}"
      duration_minutes: "{{ trigger.to_state.attributes.duration_minutes | default(0) }}"
  - choose:
      - conditions:
          - condition: trigger
            id: started
        sequence:
          - sequence: !input session_started
          - if:
              - condition: template
                value_template: "{{ detection | length > 0 }}"
            then:
              - action: switch.turn_on
                target:
                  entity_id: !input detection
          - if:
              - condition: template
                value_template: "{{ calibration | length > 0 and reason != 'first_dart' }}"
            then:
              - delay:
                  seconds: !input calibration_delay
              - action: button.press
                target:
                  entity_id: !input calibration
      - conditions:
          - condition: trigger
            id: ended
        sequence:
          - if:
              - condition: template
                value_template: "{{ detection | length > 0 }}"
            then:
              - action: switch.turn_off
                target:
                  entity_id: !input detection
          - sequence: !input session_ended
