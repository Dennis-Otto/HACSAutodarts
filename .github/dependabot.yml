version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    # Let a fresh release settle for a week; security updates skip the wait.
    cooldown:
      default-days: 7
    groups:
      python-routine:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      python-major:
        patterns:
          - "*"
        update-types:
          - major
    commit-message:
      prefix: chore
      include: scope

  # Tools of the browser test and screenshots in the Playwright image.
  - package-ecosystem: pip
    directory: /tests/e2e
    schedule:
      interval: weekly
      day: monday
      time: "04:10"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    # Let a fresh release settle for a week; security updates skip the wait.
    cooldown:
      default-days: 7
    ignore:
      # Playwright must match the browsers of the pinned Playwright image.
      - dependency-name: playwright
    groups:
      browser-tools:
        patterns:
          - "*"
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    # Let a fresh release settle for a week; security updates skip the wait.
    cooldown:
      default-days: 7
    groups:
      npm-routine:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:20"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    # Let a fresh release settle for a week; security updates skip the wait.
    cooldown:
      default-days: 7
    groups:
      actions-routine:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      actions-major:
        patterns:
          - "*"
        update-types:
          - major
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker-compose
    directory: /tests/e2e
    schedule:
      interval: weekly
      day: monday
      time: "04:40"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    # Let a fresh release settle for a week; security updates skip the wait.
    cooldown:
      default-days: 7
    groups:
      containers-routine:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      containers-major:
        patterns:
          - "*"
        update-types:
          - major
    commit-message:
      prefix: chore
      include: scope
