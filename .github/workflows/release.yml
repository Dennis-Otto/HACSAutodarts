name: Release integration

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version from manifest.json, for example 1.0.0"
        required: true
        type: string
      introduction:
        description: "Optional introduction above the generated changelog (Markdown)"
        required: false
        type: string
      prerelease:
        description: "Mark as prerelease (HACS offers it only with its beta switch on); a version such as 1.6.0-rc.1 always is one"
        default: false
        type: boolean
      draft:
        description: "Save as a draft to review before publishing"
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-integration
  cancel-in-progress: false

jobs:
  tests:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/tests.yml

  validation:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/validate.yml

  commit-checks:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require successful checks on the published commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/dependency_release.py --verify-commit "$GITHUB_SHA"

  release:
    if: github.ref == 'refs/heads/main'
    needs: [tests, validation, commit-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only publication creates a deployment; draft releases remain untracked.
    environment:
      name: release
      deployment: ${{ !inputs.draft }}
      url: https://github.com/${{ github.repository }}/releases/tag/v${{ inputs.version }}
    permissions:
      contents: write
      # Sign the build provenance of the release package with Sigstore.
      id-token: write
      attestations: write
    # The write token goes only to the steps that call the GitHub API.
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ inputs.version }}
      RELEASE_INTRODUCTION: ${{ inputs.introduction }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release version
        id: version
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"].strip()
          if not re.fullmatch(r"(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?", version):
              raise SystemExit("Use a version such as 0.4.3 or 0.4.3-rc.1, without the v prefix.")
          manifest = json.loads(Path("custom_components/autodarts/manifest.json").read_text())
          if manifest["version"] != version:
              raise SystemExit(f"Release version {version} does not match manifest version {manifest['version']}.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"tag=v{version}\n")
              output.write(f"is_prerelease={'true' if '-' in version else 'false'}\n")
          PY

      - name: Refuse an existing tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          # GitHub would silently bind the release to an existing tag, while the
          # package and its provenance below always come from this commit.
          if gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" --silent 2>/dev/null; then
            echo "::error::Tag $RELEASE_TAG already exists; a release is never rebuilt."
            exit 1
          fi

      - name: Generate changelog from merged pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh api --method POST "repos/$GH_REPO/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" \
            -f target_commitish="$GITHUB_SHA" \
            -f configuration_file_path=.github/release.yml \
            --jq .body > "$RUNNER_TEMP/generated-notes.md"

      - name: Prepend optional introduction
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          directory = Path(os.environ["RUNNER_TEMP"])
          introduction = os.environ.get("RELEASE_INTRODUCTION", "").strip()
          changelog = (directory / "generated-notes.md").read_text().strip()
          if not changelog:
              raise SystemExit("GitHub returned an empty changelog.")
          sections = [section for section in (introduction, changelog) if section]
          notes = "\n\n".join(sections) + "\n"
          (directory / "release-notes.md").write_text(notes)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(notes)
          PY

      - name: Create a draft release with changelog for HACS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease || steps.version.outputs.is_prerelease == 'true' }}
        run: |
          title="Autodarts $RELEASE_TAG"
          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then title+=" (pre-release)"; fi
          # Always a draft first: HACS must never offer a release without its signed package.
          args=("$RELEASE_TAG" --target "$GITHUB_SHA" --title "$title" --draft
                --notes-file "$RUNNER_TEMP/release-notes.md" --fail-on-no-commits)
          if [[ "$RELEASE_PRERELEASE" == "true" ]]; then args+=(--prerelease); fi
          gh release create "${args[@]}"

      - name: Package the integration reproducibly
        run: |
          # The archive holds the integration folder's content, as HACS zip releases do.
          git archive --format=zip --output="$RUNNER_TEMP/autodarts.zip" \
            "$GITHUB_SHA:custom_components/autodarts"
          sha256sum "$RUNNER_TEMP/autodarts.zip" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/autodarts.zip

      - name: Attach the package and its signed provenance
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "$BUNDLE_PATH" "$RUNNER_TEMP/autodarts.zip.sigstore.json"
          # The signed SLSA statement also as an in-toto file, as SLSA tooling expects it.
          jq -c '.dsseEnvelope' "$BUNDLE_PATH" > "$RUNNER_TEMP/autodarts.zip.intoto.jsonl"
          gh release upload "$RELEASE_TAG" \
            "$RUNNER_TEMP/autodarts.zip" "$RUNNER_TEMP/autodarts.zip.sigstore.json" \
            "$RUNNER_TEMP/autodarts.zip.intoto.jsonl"

      - name: Publish the release
        if: ${{ !inputs.draft }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Publishing creates the tag on this commit, now that every asset is attached.
          gh release edit "$RELEASE_TAG" --draft=false
          gh release view "$RELEASE_TAG" --json tagName,isDraft,assets \
            --jq '"Published \(.tagName) with \(.assets | length) assets"' | tee -a "$GITHUB_STEP_SUMMARY"
