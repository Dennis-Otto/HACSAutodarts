name: Release dependency updates

on:
  pull_request_target:
    branches: [main]
    types: [closed]
  # GitHub suppresses events caused by GITHUB_TOKEN. Reconcile automatically
  # merged PRs too, without storing a personal access token or bypassing main.
  schedule:
    - cron: "13,43 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.repository == 'Dennis-Otto/HACSAutodarts' &&
      (github.event_name == 'workflow_dispatch' || vars.RELEASE_AUTOMATION_CLIENT_ID != '') &&
      (github.event_name != 'pull_request_target' ||
        (github.event.pull_request.merged &&
         github.event.pull_request.user.login == 'dependabot[bot]' &&
         github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    # Allow registration delays plus PR checks, protected merge and publication.
    timeout-minutes: 90
    environment: release
    permissions:
      contents: read
      pull-requests: read
      actions: write
      checks: read
    steps:
      # Only trusted default-branch code executes with this token. Candidate
      # integration code runs in the existing, PR-associated CI jobs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Create repository-scoped release token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_AUTOMATION_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      - name: Prepare, validate and publish dependency release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_RELEASE_TOKEN: ${{ steps.release-token.outputs.token }}
          GH_RELEASE_APP_SLUG: ${{ steps.release-token.outputs.app-slug }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/dependency_release.py
